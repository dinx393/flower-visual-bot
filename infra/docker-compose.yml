services:
  bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flower_bot
      POSTGRES_USER: flower_bot
      POSTGRES_PASSWORD: flower_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flower_bot -d flower_bot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
