[project]
name = "flower-visual-bot"
version = "0.1.0"
description = "Human-approved visual-story workflow for a flower shop"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
